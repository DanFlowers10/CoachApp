{% extends "base.html" %}
{% block title %}Add client{% endblock %}
{% block content %}
<h2 class="mb-3">Add a client</h2>
<div class="row">
  <div class="col-md-6">
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Client name</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Client email</label>
        <input type="email" name="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Temporary password</label>
        <input type="text" name="temp_password" class="form-control" required minlength="6">
        <div class="form-text">Share this with your client so they can log in — they can change it themselves afterwards under "Change password".</div>
      </div>
      <button class="btn btn-primary">Create client account</button>
      <a href="{{ url_for('coach_dashboard') }}" class="btn btn-link">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
