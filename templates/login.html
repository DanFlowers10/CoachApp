{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="auth-card">
      <h2 class="mb-3">Log in</h2>
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-accent w-100">Log in</button>
      </form>
      <p class="mt-3 small mb-1">Coaching your own athletes and need an account?
        <a href="{{ url_for('register') }}">Sign up as a coach</a>.</p>
      <p class="small text-muted mb-0">Clients: ask your coach for your login details — they create your account for you.</p>
    </div>
  </div>
</div>
{% endblock %}
