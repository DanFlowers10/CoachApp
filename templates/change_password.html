{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<a href="javascript:history.back()" class="small d-block mb-3">&larr; Back</a>

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="auth-card">
      <h2 class="auth-card-title">Change your password</h2>
      <p class="auth-card-sub">Pick something you'll remember &mdash; at least 6 characters.</p>
      <form method="post">
        <div class="auth-field">
          <i class="ti ti-lock"></i>
          <input type="password" name="current_password" placeholder="Current password" required>
        </div>
        <div class="auth-field">
          <i class="ti ti-key"></i>
          <input type="password" name="new_password" placeholder="New password" required minlength="6">
        </div>
        <div class="auth-field">
          <i class="ti ti-key"></i>
          <input type="password" name="confirm_password" placeholder="Confirm new password" required minlength="6">
        </div>
        <button class="btn btn-accent w-100 auth-submit">Update password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
