<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Marathon Coach{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d11" id="theme-color-meta">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marathon Coach">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon-32.png') }}" sizes="32x32">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon-16.png') }}" sizes="16x16">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="{{ 'has-bottom-nav' if current_user.is_authenticated and not current_user.is_coach() else '' }}">
  <div class="toast-stack" id="toast-stack">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast-item {{ 'error' if category == 'error' else 'success' }}">
          <i class="ti {{ 'ti-alert-circle' if category == 'error' else 'ti-circle-check' }}"></i>
          <span>{{ message }}</span>
          <button type="button" class="toast-close" aria-label="Dismiss" onclick="dismissToast(this.parentElement)"><i class="ti ti-x"></i></button>
        </div>
      {% endfor %}
    {% endwith %}
  </div>

  <div class="nav-progress" id="nav-progress"></div>

  <div class="pull-refresh" id="pull-refresh">
    <div class="pull-refresh-spinner"><i class="ti ti-arrow-down" id="pull-refresh-icon"></i></div>
  </div>

  <div id="page-scroll-wrap">
    {% block header %}
    <nav class="app-nav mb-4">
      <div class="container py-2 d-flex align-items-center justify-content-between">
        {% include "_account_menu.html" %}
      </div>
    </nav>
    {% endblock %}

    <div class="container pb-5">
      {% block content %}{% endblock %}
    </div>
  </div>

  {% include "_athlete_nav.html" %}

  <script>
    // Instant tap feedback on the bottom nav - the actual page load still takes
    // as long as the network round-trip does, but showing something the moment
    // a tap registers makes it feel responsive instead of frozen, especially
    // installed as a PWA where there's no browser loading spinner to look at.
    document.querySelectorAll('.bottom-nav-item').forEach(function (link) {
      link.addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || link.classList.contains('active')) return;
        document.getElementById('nav-progress').classList.add('is-active');
      });
    });
  </script>

  <script>
    function dismissToast(el) {
      if (!el) return;
      el.classList.add('toast-leave');
      setTimeout(function () { el.remove(); }, 200);
    }
    function showToast(message, category) {
      var stack = document.getElementById('toast-stack');
      if (!stack) return;
      var el = document.createElement('div');
      el.className = 'toast-item ' + (category === 'error' ? 'error' : 'success');
      var icon = category === 'error' ? 'ti-alert-circle' : 'ti-circle-check';
      el.innerHTML = '<i class="ti ' + icon + '"></i><span></span><button type="button" class="toast-close" aria-label="Dismiss"><i class="ti ti-x"></i></button>';
      el.querySelector('span').textContent = message;
      el.querySelector('.toast-close').addEventListener('click', function () { dismissToast(el); });
      stack.appendChild(el);
      setTimeout(function () { dismissToast(el); }, 5000);
    }
    document.querySelectorAll('.toast-item').forEach(function (el) {
      setTimeout(function () { dismissToast(el); }, 5000);
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js', {scope: '/'});
      });
    }
  </script>

  <script>
    function toggleAccountMenu() {
      document.getElementById('account-dropdown').classList.toggle('is-open');
    }
    document.addEventListener('click', function (e) {
      var menu = document.querySelector('.account-menu');
      if (menu && !menu.contains(e.target)) {
        document.getElementById('account-dropdown').classList.remove('is-open');
      }
    });

    function applyTheme(theme) {
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      var sw = document.getElementById('theme-switch');
      if (sw) sw.classList.toggle('is-light', theme === 'light');
      var meta = document.getElementById('theme-color-meta');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f4f7' : '#0d0d11');
    }
    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('theme', next); } catch (e) {}
      applyTheme(next);
    }
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
  </script>

  <script>
    // Pull-to-refresh, installed-app only: a plain browser tab already has this via
    // the OS/browser chrome, but once installed as a PWA there's no chrome left,
    // so there's otherwise no way to force a reload short of force-quitting the app.
    (function () {
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (!isStandalone) return;

      var el = document.getElementById('pull-refresh');
      var wrap = document.getElementById('page-scroll-wrap');
      var DEADZONE = 16;
      var THRESHOLD = 110;
      var MAX_PULL = 140;
      var startY = null;
      var pulling = false;
      var ready = false;

      document.addEventListener('touchstart', function (e) {
        if (window.scrollY > 0) { startY = null; return; }
        startY = e.touches[0].clientY;
        pulling = true;
        ready = false;
        wrap.style.transition = 'none';
      }, {passive: true});

      document.addEventListener('touchmove', function (e) {
        if (!pulling || startY === null) return;
        var delta = e.touches[0].clientY - startY - DEADZONE;
        if (delta <= 0) { wrap.style.transform = ''; ready = false; el.classList.remove('is-ready'); return; }
        var dist = Math.min(delta * 0.35, MAX_PULL);
        wrap.style.transform = 'translateY(' + dist + 'px)';
        ready = dist >= THRESHOLD;
        el.classList.toggle('is-ready', ready);
      }, {passive: true});

      document.addEventListener('touchend', function () {
        if (!pulling) return;
        pulling = false;
        wrap.style.transition = 'transform .2s cubic-bezier(.2,.8,.2,1)';
        if (ready) {
          var icon = document.getElementById('pull-refresh-icon');
          if (icon) icon.className = 'ti ti-loader-2';
          el.classList.add('is-loading');
          wrap.style.transform = 'translateY(' + THRESHOLD + 'px)';
          location.reload();
        } else {
          wrap.style.transform = '';
          el.classList.remove('is-ready');
        }
        startY = null;
      });
    })();
  </script>
</body>
</html>
