<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Marathon Coach{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d11" id="theme-color-meta">
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marathon Coach">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon-32.png') }}" sizes="32x32">
  <link rel="icon" href="{{ url_for('static', filename='icons/favicon-16.png') }}" sizes="16x16">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
  <link href="{{ static_url('style.css') }}" rel="stylesheet">
</head>
<body class="{{ 'has-bottom-nav' if current_user.is_authenticated and not current_user.is_coach() else '' }}" {% block body_attrs %}{% endblock %}>
  <div class="toast-stack" id="toast-stack">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast-item {{ 'error' if category == 'error' else 'success' }}">
          <i class="ti {{ 'ti-alert-circle' if category == 'error' else 'ti-circle-check' }}"></i>
          <span>{{ message }}</span>
          <button type="button" class="toast-close" aria-label="Dismiss" onclick="dismissToast(this.parentElement)"><i class="ti ti-x"></i></button>
        </div>
      {% endfor %}
    {% endwith %}
  </div>

  <div class="nav-progress" id="nav-progress"></div>

  {% block header %}
  <nav class="app-nav mb-4">
    <div class="container py-2 d-flex align-items-center justify-content-between">
      {% include "_account_menu.html" %}
    </div>
  </nav>
  {% endblock %}

  <div class="pull-refresh-gap" id="pull-refresh-gap">
    <div class="pull-refresh-spinner"><i class="ti ti-loader-2"></i></div>
  </div>

  <div class="container pb-5" id="page-content">
    {% block content %}{% endblock %}
  </div>

  {% include "_athlete_nav.html" %}

  <script>
    // Instant tap feedback on the bottom nav - but only when there's actually
    // something to wait for. If the destination is already cached (see the
    // stale-while-revalidate service worker), showing a loading bar would be
    // actively misleading since there's no real wait happening; it should only
    // appear for a genuine network fetch (first visit to a page, or right after
    // an action wiped the cache). navCacheKey() must stay in sync with
    // cacheKeyFor() in service-worker.js - same cache name, same date-keying
    // for the Today page.
    function navCacheKey(href) {
      var url = new URL(href, location.origin);
      if (url.pathname === '/athlete') {
        url.searchParams.set('_cachedate', new Date().toISOString().slice(0, 10));
      }
      return url.toString();
    }

    // Warm the destination into the page cache the instant a finger touches
    // the tab (touchstart fires well before click on mobile) so that by the
    // time the tap actually registers, the page is often already cached and
    // the subsequent navigation is a cache hit instead of a cold fetch.
    var warmedHrefs = {};
    function warmNavTarget(href) {
      if (warmedHrefs[href] || !('caches' in window)) return;
      warmedHrefs[href] = true;
      caches.open('page-cache-v1').then(function (cache) {
        cache.match(navCacheKey(href)).then(function (cached) {
          if (cached) return;
          fetch(href, {credentials: 'same-origin'}).then(function (resp) {
            if (resp.ok && !resp.redirected) cache.put(navCacheKey(href), resp.clone());
          }).catch(function () {});
        });
      });
    }

    document.querySelectorAll('.bottom-nav-item').forEach(function (link) {
      if (link.classList.contains('active')) return;
      var href = link.getAttribute('href');
      link.addEventListener('touchstart', function () { warmNavTarget(href); }, {passive: true});
      link.addEventListener('pointerdown', function () { warmNavTarget(href); });

      link.addEventListener('click', function (e) {
        if (e.metaKey || e.ctrlKey || e.shiftKey || link.classList.contains('active')) return;

        if (!('caches' in window)) {
          document.getElementById('nav-progress').classList.add('is-active');
          return;
        }

        e.preventDefault();
        caches.open('page-cache-v1')
          .then(function (cache) { return cache.match(navCacheKey(href)); })
          .then(function (cached) {
            if (!cached) document.getElementById('nav-progress').classList.add('is-active');
            location.href = href;
          })
          .catch(function () {
            document.getElementById('nav-progress').classList.add('is-active');
            location.href = href;
          });
      });
    });
  </script>

  <script>
    function dismissToast(el) {
      if (!el) return;
      el.classList.add('toast-leave');
      setTimeout(function () { el.remove(); }, 200);
    }
    function showToast(message, category) {
      var stack = document.getElementById('toast-stack');
      if (!stack) return;
      var el = document.createElement('div');
      el.className = 'toast-item ' + (category === 'error' ? 'error' : 'success');
      var icon = category === 'error' ? 'ti-alert-circle' : 'ti-circle-check';
      el.innerHTML = '<i class="ti ' + icon + '"></i><span></span><button type="button" class="toast-close" aria-label="Dismiss"><i class="ti ti-x"></i></button>';
      el.querySelector('span').textContent = message;
      el.querySelector('.toast-close').addEventListener('click', function () { dismissToast(el); });
      stack.appendChild(el);
      setTimeout(function () { dismissToast(el); }, 5000);
    }
    document.querySelectorAll('.toast-item').forEach(function (el) {
      setTimeout(function () { dismissToast(el); }, 5000);
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/service-worker.js', {scope: '/'});
      });
    }

    // Shrinks an element's height to 0 before removing it, instead of an abrupt
    // DOM removal, so the content below doesn't visibly snap up into its place.
    function collapseAndRemove(el) {
      if (!el) return;
      var startHeight = el.offsetHeight;
      el.style.height = startHeight + 'px';
      el.style.overflow = 'hidden';
      el.style.transition = 'height .2s ease, opacity .2s ease, margin .2s ease';
      void el.offsetHeight; // force layout so the transition below actually animates
      requestAnimationFrame(function () {
        el.style.height = '0px';
        el.style.marginTop = '0px';
        el.style.marginBottom = '0px';
        el.style.opacity = '0';
      });
      setTimeout(function () { el.remove(); }, 220);
    }
  </script>

  <script>
    // Optimistic Mark Done / Mark Not Done: flips every instance of this
    // workout's done-button on the page (e.g. Today's focus card AND its
    // overlay both show the same workout) immediately, then fires the POST
    // silently in the background instead of doing a full page reload. Only
    // reverts if the request actually fails. Aggregate stats elsewhere on
    // the page (week totals, the progress ring %) are refreshed on the next
    // natural page load rather than live-recomputed here.
    document.addEventListener('submit', function (e) {
      var form = e.target;
      if (!form.matches('[data-done-form]')) return;
      e.preventDefault();

      var postUrl = form.getAttribute('action');
      var workoutId = form.getAttribute('data-workout-id');
      var willBeDone = form.getAttribute('data-action-type') === 'complete';
      if (navigator.vibrate) navigator.vibrate(12);

      function applyState(done) {
        document.querySelectorAll('form[data-done-form][data-workout-id="' + workoutId + '"]').forEach(function (f) {
          var btn = f.querySelector('button, [role="button"]');
          if (btn) {
            btn.classList.toggle('is-done', done);
            btn.setAttribute('aria-label', done ? 'Mark not done' : 'Mark done');
          }
          f.setAttribute('action', '/workout/' + workoutId + (done ? '/uncomplete' : '/complete'));
          f.setAttribute('data-action-type', done ? 'uncomplete' : 'complete');
        });
      }

      applyState(willBeDone);

      fetch(postUrl, {method: 'POST', headers: {'X-Requested-With': 'fetch'}, credentials: 'same-origin'})
        .then(function (r) { if (!r.ok) throw new Error('bad status'); })
        .catch(function () {
          applyState(!willBeDone);
          showToast("Couldn't save - check your connection.", 'error');
        });
    });
  </script>

  <script>
    function toggleAccountMenu() {
      document.getElementById('account-dropdown').classList.toggle('is-open');
    }
    document.addEventListener('click', function (e) {
      var menu = document.querySelector('.account-menu');
      if (menu && !menu.contains(e.target)) {
        document.getElementById('account-dropdown').classList.remove('is-open');
      }
    });

    function applyTheme(theme) {
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      var sw = document.getElementById('theme-switch');
      if (sw) sw.classList.toggle('is-light', theme === 'light');
      var meta = document.getElementById('theme-color-meta');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f3f4f7' : '#0d0d11');
    }
    function toggleTheme() {
      var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('theme', next); } catch (e) {}
      applyTheme(next);
    }
    applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
  </script>

  <script>
    // Pull-to-refresh, installed-app only: a plain browser tab already has this via
    // the OS/browser chrome, but once installed as a PWA there's no chrome left,
    // so there's otherwise no way to force a reload short of force-quitting the app.
    // The header never moves - a gap opens up below it (pushing the content down)
    // and the content dims slightly while it refreshes, matching Runna's pattern.
    (function () {
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      if (!isStandalone || document.body.hasAttribute('data-no-pull-refresh')) return;

      var gap = document.getElementById('pull-refresh-gap');
      var content = document.getElementById('page-content');
      var DEADZONE = 6;
      var THRESHOLD = 46;
      var MAX_PULL = 60;
      var startY = null;
      var pulling = false;
      var ready = false;

      document.addEventListener('touchstart', function (e) {
        if (window.scrollY > 0) { startY = null; return; }
        startY = e.touches[0].clientY;
        pulling = true;
        ready = false;
        gap.style.transition = 'none';
      }, {passive: true});

      document.addEventListener('touchmove', function (e) {
        if (!pulling || startY === null) return;
        var delta = e.touches[0].clientY - startY - DEADZONE;
        if (delta <= 0) { gap.style.height = '0px'; content.style.opacity = ''; ready = false; return; }
        var dist = Math.min(delta * 0.6, MAX_PULL);
        gap.style.height = dist + 'px';
        content.style.opacity = String(1 - Math.min(dist / MAX_PULL, 1) * 0.35);
        ready = dist >= THRESHOLD;
      }, {passive: true});

      document.addEventListener('touchend', function () {
        if (!pulling) return;
        pulling = false;
        gap.style.transition = 'height .2s cubic-bezier(.2,.8,.2,1)';
        if (ready) {
          gap.classList.add('is-loading');
          gap.style.height = THRESHOLD + 'px';
          // A manual pull-to-refresh should always force a real Strava check,
          // even if the normal on-load sync was throttled recently.
          try { sessionStorage.setItem('force_strava_sync', '1'); } catch (e) {}
          location.reload();
        } else {
          gap.style.height = '0px';
          content.style.opacity = '';
        }
        startY = null;
      });
    })();
  </script>
</body>
</html>
