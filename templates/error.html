{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="auth-card text-center" style="max-width: 420px; margin: 3rem auto;">
  <div class="stat-value accent" style="font-size: 2.5rem;">{{ code }}</div>
  <p class="mt-2 mb-3">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-accent">Go home</a>
</div>
{% endblock %}
